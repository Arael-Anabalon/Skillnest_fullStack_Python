<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Usuarios</h1>
            <a href="{{ url_for('usuario_nuevo') }}" class="btn btn-primary">Nuevo Usuario</a>
        </div>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>E-mail</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in todos_usuarios %}
                <tr>
                    <td>{{ usuario.id }}</td>
                    <td>{{ usuario.nombre }} {{ usuario.apellido }}</td>
                    <td>{{ usuario.email }}</td>
                    <td>{{ usuario.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="{{ url_for('mostrar_usuario', id=usuario.id) }}"
                            class="btn btn-sm btn-info text-white">Ver</a>
                        <a href="{{ url_for('editar_usuario', id=usuario.id) }}"
                            class="btn btn-sm btn-warning text-white">Editar</a>
                        <a href="{{ url_for('eliminar_usuario', id=usuario.id) }}"
                            class="btn btn-sm btn-danger">Borrar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
