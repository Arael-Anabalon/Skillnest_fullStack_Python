<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle de Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mb-4">Usuario {{ usuario.id }}</h1>
                <div class="card p-4 shadow-sm mb-4">
                    <p><strong>Nombre Completo:</strong> {{ usuario.nombre }} {{ usuario.apellido }}</p>
                    <p><strong>E-mail:</strong> {{ usuario.email }}</p>
                    <p><strong>Creado el:</strong> {{ usuario.created_at }}</p>
                    <p><strong>Actualizado el:</strong> {{ usuario.updated_at }}</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('editar_usuario', id=usuario.id) }}"
                        class="btn btn-warning text-white">Editar</a>
                    <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">Volver a Usuarios</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
